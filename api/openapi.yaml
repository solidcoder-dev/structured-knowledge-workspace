openapi: 3.0.3
info:
  title: Structured Knowledge Workspace API
  version: 0.3.1
  description: |
    Framework-independent API for storing and retrieving structured knowledge.

    The core model deliberately contains only Workspaces, Entries with generic
    Properties, and typed Relationships between Entries. Concepts such as goals,
    capabilities, behaviours, comments, statuses, authors and business rules belong
    to the consuming framework.

    All timestamps are UTC. Property names and relationship types are case-sensitive.
    Protected mutations require X-Principal-Id. This header is a temporary integration identity seam, not authentication; a future authenticated principal resolver may replace it without changing SKW application services.
    POST operations that accept `Idempotency-Key` scope the key to the operation target.
    Keys contain 1–255 visible ASCII characters without spaces.
    Reusing a key with the same payload returns the original
    result; reusing it with a different payload returns `409 Conflict`.
    See api/README.md for normative mutation, ordering and pagination rules.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: System
    description: Process availability checks.
  - name: Workspaces
    description: Isolation boundaries for knowledge, access and search.
  - name: Namespaces
    description: Registered vocabulary prefixes for namespaced knowledge.
  - name: Access Control
    description: Generic principal policies scoped to a Workspace or Namespace.
  - name: Entries
    description: Generic units of knowledge described by Properties.
  - name: Relationships
    description: Directed, typed connections between Entries in one Workspace.
  - name: Search
    description: Exact, full-text and semantic retrieval without exposing embeddings.
  - name: Transactions
    description: Atomic multi-resource mutations intended for people and agents.
