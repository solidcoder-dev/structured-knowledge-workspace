PropertyName:
  type: string
  pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
  minLength: 1
  maxLength: 128
  example: product.kind

PropertyValue:
  description: |
    A scalar or a homogeneous array of scalars. Objects, mixed arrays and null are
    not valid. Empty arrays are valid. Values with identity or lifecycle must be
    represented as Entries connected by Relationships instead of embedded here.
  anyOf:
    - type: string
      maxLength: 100000
    - type: number
    - type: boolean
    - type: array
      maxItems: 1000
      items:
        type: string
        maxLength: 100000
    - type: array
      maxItems: 1000
      items:
        type: number
    - type: array
      maxItems: 1000
      items:
        type: boolean

Properties:
  type: object
  description: Case-sensitive property map. Keys are stable identifiers, not display labels.
  maxProperties: 256
  additionalProperties:
    $ref: './properties.yaml#/PropertyValue'
  example:
    product.kind: capability
    product.name: Record a movement
    product.labels:
      - finance
      - mobile

PropertyValueRequest:
  type: object
  additionalProperties: false
  required:
    - value
  properties:
    value:
      $ref: './properties.yaml#/PropertyValue'
