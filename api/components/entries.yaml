Entry:
  type: object
  required:
    - id
    - workspaceId
    - properties
    - metadata
  properties:
    id:
      type: string
      format: uuid
    workspaceId:
      type: string
      format: uuid
    properties:
      $ref: './properties.yaml#/Properties'
    metadata:
      $ref: './common.yaml#/ResourceMetadata'

InitialRelationship:
  type: object
  additionalProperties: false
  required:
    - direction
    - otherEntryId
    - type
  properties:
    direction:
      type: string
      enum:
        - OUTGOING
        - INCOMING
      description: Direction relative to the Entry being created.
    otherEntryId:
      type: string
      format: uuid
    type:
      $ref: './relationships.yaml#/RelationshipType'

CreateEntryRequest:
  type: object
  additionalProperties: false
  properties:
    properties:
      $ref: './properties.yaml#/Properties'
    relationships:
      type: array
      maxItems: 100
      description: Relationships created atomically with the Entry.
      items:
        $ref: './entries.yaml#/InitialRelationship'

EntryPage:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: './entries.yaml#/Entry'
    nextCursor:
      type: string
      description: Omitted when there is no next page.

CreateEntryResponse:
  type: object
  required: [entry, relationships]
  properties:
    entry:
      $ref: './entries.yaml#/Entry'
    relationships:
      type: array
      description: All initial relationships, including server-generated IDs, in request order.
      items:
        $ref: './relationships.yaml#/Relationship'
