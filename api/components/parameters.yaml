WorkspaceId:
  name: workspaceId
  in: path
  required: true
  description: Workspace identifier.
  schema:
    type: string
    format: uuid
EntryId:
  name: entryId
  in: path
  required: true
  description: Entry identifier.
  schema:
    type: string
    format: uuid
RelationshipId:
  name: relationshipId
  in: path
  required: true
  description: Relationship identifier.
  schema:
    type: string
    format: uuid
PropertyName:
  name: propertyName
  in: path
  required: true
  description: Case-sensitive stable property key, not a user-facing label.
  schema:
    $ref: './properties.yaml#/PropertyName'
Cursor:
  name: cursor
  in: query
  required: false
  description: Opaque cursor returned by the previous page; clients must not parse it.
  schema:
    type: string
    minLength: 1
    maxLength: 2048
Limit:
  name: limit
  in: query
  required: false
  description: Maximum number of resources to return.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 25
IfMatch:
  name: If-Match
  in: header
  required: false
  description: Strong ETag of the resource being changed. A stale value returns 412.
  schema:
    type: string
IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: Retry-safe key scoped to the operation target; visible ASCII only, without spaces.
  schema:
    type: string
    minLength: 1
    maxLength: 255
    pattern: '^[!-~]+$'
PrincipalId:
  name: X-Principal-Id
  in: header
  required: true
  description: Trusted boundary value identifying the authenticated principal; authentication is outside SKW.
  schema:
    $ref: './access-control.yaml#/PrincipalId'

Namespace:
  name: namespace
  in: path
  required: true
  description: Registered vocabulary namespace.
  schema:
    $ref: './namespaces.yaml#/NamespaceName'

PolicyPrincipalId:
  name: principalId
  in: path
  required: true
  description: Principal whose policy is being addressed.
  schema:
    $ref: './access-control.yaml#/PrincipalId'
