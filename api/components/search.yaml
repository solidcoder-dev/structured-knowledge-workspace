SearchMode:
  type: string
  description: |
    EXACT compares the query with complete string Property values. TEXT performs
    lexical full-text retrieval. SEMANTIC uses the derived semantic index. HYBRID
    combines lexical and semantic retrieval.
  enum:
    - EXACT
    - TEXT
    - SEMANTIC
    - HYBRID

PropertyFilter:
  type: object
  additionalProperties: false
  required:
    - property
    - operator
  properties:
    property:
      $ref: './properties.yaml#/PropertyName'
    operator:
      type: string
      enum:
        - EQUALS
        - CONTAINS
        - EXISTS
    value:
      $ref: './properties.yaml#/PropertyValue'
  description: |
    EQUALS requires value and compares type and whole value, including array order.
    CONTAINS requires a scalar and tests exact array membership, not substring.
    EXISTS forbids value and tests key presence. Missing properties never match
    EQUALS or CONTAINS. Strings are case-sensitive; numbers compare numerically.
    Invalid combinations return 422.

GraphFilter:
  type: object
  additionalProperties: false
  required:
    - entryId
  properties:
    entryId:
      type: string
      format: uuid
    direction:
      type: string
      enum:
        - INCOMING
        - OUTGOING
        - BOTH
      default: BOTH
    relationshipTypes:
      type: array
      uniqueItems: true
      maxItems: 50
      items:
        $ref: './relationships.yaml#/RelationshipType'
    maxDepth:
      type: integer
      format: int32
      minimum: 1
      maximum: 5
      default: 1

SearchRequest:
  type: object
  additionalProperties: false
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 2000
    mode:
      $ref: './search.yaml#/SearchMode'
    filters:
      type: array
      minItems: 1
      maxItems: 50
      items:
        $ref: './search.yaml#/PropertyFilter'
    graph:
      $ref: './search.yaml#/GraphFilter'
    cursor:
      type: string
      minLength: 1
      maxLength: 2048
    limit:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      default: 25
  description: |
    Supply a nonempty query, nonempty filters, or graph. With a query, omitted mode
    defaults to HYBRID. Without a query, omit mode: retrieval uses only filters/graph
    and score 1. Explicit mode without query returns 422. All filters are ANDed and
    intersected with the graph candidate set before ranking.

SearchHighlight:
  type: object
  required:
    - property
    - fragments
  properties:
    property:
      $ref: './properties.yaml#/PropertyName'
    fragments:
      type: array
      maxItems: 10
      items:
        type: string

SearchHit:
  type: object
  required:
    - entry
    - score
  properties:
    entry:
      $ref: './entries.yaml#/Entry'
    score:
      type: number
      format: double
      minimum: 0
      maximum: 1
    highlights:
      type: array
      items:
        $ref: './search.yaml#/SearchHighlight'

SearchResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: './search.yaml#/SearchHit'
    nextCursor:
      type: string
