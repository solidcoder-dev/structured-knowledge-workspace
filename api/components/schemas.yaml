PropertyName:
  type: string
  pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
  minLength: 1
  maxLength: 128
  example: product.kind

RelationshipType:
  type: string
  pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
  minLength: 1
  maxLength: 128
  example: product.supports

PropertyValue:
  description: |
    A scalar or a homogeneous array of scalars. Objects, mixed arrays and null are
    not valid. Empty arrays are valid. Values with identity or lifecycle must be
    represented as Entries connected by Relationships instead of embedded here.
  anyOf:
    - type: string
      maxLength: 100000
    - type: number
    - type: boolean
    - type: array
      maxItems: 1000
      items:
        type: string
        maxLength: 100000
    - type: array
      maxItems: 1000
      items:
        type: number
    - type: array
      maxItems: 1000
      items:
        type: boolean

Properties:
  type: object
  description: Case-sensitive property map. Keys are stable identifiers, not display labels.
  maxProperties: 256
  additionalProperties:
    $ref: '#/PropertyValue'
  example:
    product.kind: capability
    product.name: Record a movement
    product.labels:
      - finance
      - mobile

ResourceMetadata:
  type: object
  required:
    - createdAt
    - updatedAt
    - version
  properties:
    createdAt:
      type: string
      format: date-time
      readOnly: true
    updatedAt:
      type: string
      format: date-time
      readOnly: true
    version:
      type: integer
      format: int64
      minimum: 1
      readOnly: true
      description: Monotonically increasing resource version.

HealthResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum:
        - UP

Workspace:
  type: object
  required:
    - id
    - properties
    - metadata
  properties:
    id:
      type: string
      format: uuid
    properties:
      $ref: '#/Properties'
    metadata:
      $ref: '#/ResourceMetadata'

CreateWorkspaceRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      description: Optional client-generated identifier, useful in deterministic imports.
    properties:
      $ref: '#/Properties'

WorkspacePage:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/Workspace'
    nextCursor:
      type: string
      description: Omitted when there is no next page.

Entry:
  type: object
  required:
    - id
    - workspaceId
    - properties
    - metadata
  properties:
    id:
      type: string
      format: uuid
    workspaceId:
      type: string
      format: uuid
    properties:
      $ref: '#/Properties'
    metadata:
      $ref: '#/ResourceMetadata'

InitialRelationship:
  type: object
  additionalProperties: false
  required:
    - direction
    - otherEntryId
    - type
  properties:
    id:
      type: string
      format: uuid
    direction:
      type: string
      enum:
        - OUTGOING
        - INCOMING
      description: Direction relative to the Entry being created.
    otherEntryId:
      type: string
      format: uuid
    type:
      $ref: '#/RelationshipType'
    position:
      type: integer
      format: int32
      minimum: 0

CreateEntryRequest:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      description: Optional client-generated identifier, useful in atomic imports.
    properties:
      $ref: '#/Properties'
    relationships:
      type: array
      maxItems: 100
      description: Relationships created atomically with the Entry.
      items:
        $ref: '#/InitialRelationship'

EntryPage:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/Entry'
    nextCursor:
      type: string
      description: Omitted when there is no next page.

PropertyValueRequest:
  type: object
  additionalProperties: false
  required:
    - value
  properties:
    value:
      $ref: '#/PropertyValue'

Relationship:
  type: object
  required:
    - id
    - workspaceId
    - sourceEntryId
    - targetEntryId
    - type
    - metadata
  properties:
    id:
      type: string
      format: uuid
    workspaceId:
      type: string
      format: uuid
    sourceEntryId:
      type: string
      format: uuid
    targetEntryId:
      type: string
      format: uuid
    type:
      $ref: '#/RelationshipType'
    position:
      type: integer
      format: int32
      minimum: 0
      description: Optional order among relationships interpreted by the consuming framework.
    metadata:
      $ref: '#/ResourceMetadata'

CreateRelationshipRequest:
  type: object
  additionalProperties: false
  required:
    - sourceEntryId
    - targetEntryId
    - type
  properties:
    id:
      type: string
      format: uuid
    sourceEntryId:
      type: string
      format: uuid
    targetEntryId:
      type: string
      format: uuid
    type:
      $ref: '#/RelationshipType'
    position:
      type: integer
      format: int32
      minimum: 0

RelationshipPage:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/Relationship'
    nextCursor:
      type: string

PositionRequest:
  type: object
  additionalProperties: false
  required:
    - position
  properties:
    position:
      type: integer
      format: int32
      minimum: 0

SearchMode:
  type: string
  description: |
    EXACT compares the query with complete string Property values. TEXT performs
    lexical full-text retrieval. SEMANTIC uses the derived semantic index. HYBRID
    combines lexical and semantic retrieval.
  enum:
    - EXACT
    - TEXT
    - SEMANTIC
    - HYBRID
  default: HYBRID

PropertyFilter:
  type: object
  additionalProperties: false
  required:
    - property
    - operator
  properties:
    property:
      $ref: '#/PropertyName'
    operator:
      type: string
      enum:
        - EQUALS
        - CONTAINS
        - EXISTS
    value:
      $ref: '#/PropertyValue'
  description: "`value` is required except for `EXISTS`. Invalid combinations return 422."

GraphFilter:
  type: object
  additionalProperties: false
  required:
    - entryId
  properties:
    entryId:
      type: string
      format: uuid
    direction:
      type: string
      enum:
        - INCOMING
        - OUTGOING
        - BOTH
      default: BOTH
    relationshipTypes:
      type: array
      uniqueItems: true
      maxItems: 50
      items:
        $ref: '#/RelationshipType'
    maxDepth:
      type: integer
      format: int32
      minimum: 1
      maximum: 5
      default: 1

SearchRequest:
  type: object
  additionalProperties: false
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 2000
    mode:
      $ref: '#/SearchMode'
    filters:
      type: array
      maxItems: 50
      items:
        $ref: '#/PropertyFilter'
    graph:
      $ref: '#/GraphFilter'
    cursor:
      type: string
      minLength: 1
      maxLength: 2048
    limit:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      default: 25
  description: |
    At least one of `query`, `filters` or `graph` must be supplied. `query` is
    required for every mode; when it is absent the request performs filtered or
    graph retrieval and ignores `mode`.

SearchHighlight:
  type: object
  required:
    - property
    - fragments
  properties:
    property:
      $ref: '#/PropertyName'
    fragments:
      type: array
      maxItems: 10
      items:
        type: string

SearchHit:
  type: object
  required:
    - entry
    - score
  properties:
    entry:
      $ref: '#/Entry'
    score:
      type: number
      format: double
      minimum: 0
      maximum: 1
    highlights:
      type: array
      items:
        $ref: '#/SearchHighlight'

SearchResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: '#/SearchHit'
    nextCursor:
      type: string

CreateEntryMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - entry
  properties:
    operation:
      type: string
      enum:
        - CREATE_ENTRY
    entry:
      allOf:
        - $ref: '#/CreateEntryRequest'
        - type: object
          required:
            - id

SetEntryPropertyMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - entryId
    - expectedVersion
    - property
    - value
  properties:
    operation:
      type: string
      enum:
        - SET_ENTRY_PROPERTY
    entryId:
      type: string
      format: uuid
    expectedVersion:
      type: integer
      format: int64
      minimum: 1
    property:
      $ref: '#/PropertyName'
    value:
      $ref: '#/PropertyValue'

DeleteEntryPropertyMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - entryId
    - expectedVersion
    - property
  properties:
    operation:
      type: string
      enum:
        - DELETE_ENTRY_PROPERTY
    entryId:
      type: string
      format: uuid
    expectedVersion:
      type: integer
      format: int64
      minimum: 1
    property:
      $ref: '#/PropertyName'

DeleteEntryMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - entryId
    - expectedVersion
  properties:
    operation:
      type: string
      enum:
        - DELETE_ENTRY
    entryId:
      type: string
      format: uuid
    expectedVersion:
      type: integer
      format: int64
      minimum: 1

CreateRelationshipMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - relationship
  properties:
    operation:
      type: string
      enum:
        - CREATE_RELATIONSHIP
    relationship:
      $ref: '#/CreateRelationshipRequest'

DeleteRelationshipMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - relationshipId
    - expectedVersion
  properties:
    operation:
      type: string
      enum:
        - DELETE_RELATIONSHIP
    relationshipId:
      type: string
      format: uuid
    expectedVersion:
      type: integer
      format: int64
      minimum: 1

SetRelationshipPositionMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - relationshipId
    - expectedVersion
    - position
  properties:
    operation:
      type: string
      enum:
        - SET_RELATIONSHIP_POSITION
    relationshipId:
      type: string
      format: uuid
    expectedVersion:
      type: integer
      format: int64
      minimum: 1
    position:
      type: integer
      format: int32
      minimum: 0

Mutation:
  oneOf:
    - $ref: '#/CreateEntryMutation'
    - $ref: '#/SetEntryPropertyMutation'
    - $ref: '#/DeleteEntryPropertyMutation'
    - $ref: '#/DeleteEntryMutation'
    - $ref: '#/CreateRelationshipMutation'
    - $ref: '#/DeleteRelationshipMutation'
    - $ref: '#/SetRelationshipPositionMutation'
  discriminator:
    propertyName: operation
    mapping:
      CREATE_ENTRY: './schemas.yaml#/CreateEntryMutation'
      SET_ENTRY_PROPERTY: './schemas.yaml#/SetEntryPropertyMutation'
      DELETE_ENTRY_PROPERTY: './schemas.yaml#/DeleteEntryPropertyMutation'
      DELETE_ENTRY: './schemas.yaml#/DeleteEntryMutation'
      CREATE_RELATIONSHIP: './schemas.yaml#/CreateRelationshipMutation'
      DELETE_RELATIONSHIP: './schemas.yaml#/DeleteRelationshipMutation'
      SET_RELATIONSHIP_POSITION: './schemas.yaml#/SetRelationshipPositionMutation'

TransactionRequest:
  type: object
  additionalProperties: false
  required:
    - mutations
  properties:
    mutations:
      type: array
      minItems: 1
      maxItems: 100
      description: |
        Mutations execute atomically in array order. Entries created here must use
        client-generated IDs so later mutations can reference them.
      items:
        $ref: '#/Mutation'

TransactionResponse:
  type: object
  required:
    - entries
    - relationships
    - deletedEntryIds
    - deletedRelationshipIds
  properties:
    entries:
      type: array
      description: Current representations of created or changed Entries.
      items:
        $ref: '#/Entry'
    relationships:
      type: array
      description: Current representations of created or changed Relationships.
      items:
        $ref: '#/Relationship'
    deletedEntryIds:
      type: array
      items:
        type: string
        format: uuid
    deletedRelationshipIds:
      type: array
      items:
        type: string
        format: uuid

ProblemFieldError:
  type: object
  required:
    - pointer
    - detail
  properties:
    pointer:
      type: string
      description: JSON Pointer to the invalid request value.
      example: /properties/product.name
    detail:
      type: string

Problem:
  type: object
  description: RFC 9457 problem details with a stable machine-readable error code.
  required:
    - type
    - title
    - status
    - code
  properties:
    type:
      type: string
      format: uri
      default: about:blank
    title:
      type: string
    status:
      type: integer
      format: int32
      minimum: 400
      maximum: 599
    detail:
      type: string
    instance:
      type: string
      format: uri
    code:
      type: string
      pattern: '^[A-Z][A-Z0-9_]*$'
      example: RELATIONSHIP_EXISTS
    errors:
      type: array
      items:
        $ref: '#/ProblemFieldError'
