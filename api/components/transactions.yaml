CreateEntryMutation:
  type: object
  additionalProperties: false
  required: [operation, entry]
  properties:
    operation:
      type: string
      enum: [CREATE_ENTRY]
    localRef:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,63}$'
      description: Optional unique local name for this new Entry.
    entry:
      $ref: './entries.yaml#/CreateEntryRequest'

SetEntryPropertyMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - entryId
    - expectedVersion
    - property
    - value
  properties:
    operation:
      type: string
      enum:
        - SET_ENTRY_PROPERTY
    entryId:
      type: string
      format: uuid
    expectedVersion:
      type: integer
      format: int64
      minimum: 1
    property:
      $ref: './properties.yaml#/PropertyName'
    value:
      $ref: './properties.yaml#/PropertyValue'

DeleteEntryPropertyMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - entryId
    - expectedVersion
    - property
  properties:
    operation:
      type: string
      enum:
        - DELETE_ENTRY_PROPERTY
    entryId:
      type: string
      format: uuid
    expectedVersion:
      type: integer
      format: int64
      minimum: 1
    property:
      $ref: './properties.yaml#/PropertyName'

DeleteEntryMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - entryId
    - expectedVersion
  properties:
    operation:
      type: string
      enum:
        - DELETE_ENTRY
    entryId:
      type: string
      format: uuid
    expectedVersion:
      type: integer
      format: int64
      minimum: 1

CreateRelationshipMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - relationship
  properties:
    operation:
      type: string
      enum:
        - CREATE_RELATIONSHIP
    relationship:
      $ref: './transactions.yaml#/TransactionRelationshipRequest'

DeleteRelationshipMutation:
  type: object
  additionalProperties: false
  required:
    - operation
    - relationshipId
  properties:
    operation:
      type: string
      enum:
        - DELETE_RELATIONSHIP
    relationshipId:
      type: string
      format: uuid

Mutation:
  oneOf:
    - $ref: './transactions.yaml#/CreateEntryMutation'
    - $ref: './transactions.yaml#/SetEntryPropertyMutation'
    - $ref: './transactions.yaml#/DeleteEntryPropertyMutation'
    - $ref: './transactions.yaml#/DeleteEntryMutation'
    - $ref: './transactions.yaml#/CreateRelationshipMutation'
    - $ref: './transactions.yaml#/DeleteRelationshipMutation'
  discriminator:
    propertyName: operation
    mapping:
      CREATE_ENTRY: './transactions.yaml#/CreateEntryMutation'
      SET_ENTRY_PROPERTY: './transactions.yaml#/SetEntryPropertyMutation'
      DELETE_ENTRY_PROPERTY: './transactions.yaml#/DeleteEntryPropertyMutation'
      DELETE_ENTRY: './transactions.yaml#/DeleteEntryMutation'
      CREATE_RELATIONSHIP: './transactions.yaml#/CreateRelationshipMutation'
      DELETE_RELATIONSHIP: './transactions.yaml#/DeleteRelationshipMutation'

TransactionRequest:
  type: object
  additionalProperties: false
  required:
    - mutations
  properties:
    mutations:
      type: array
      minItems: 1
      maxItems: 100
      description: |
        Mutations execute atomically in array order. CREATE_ENTRY may declare localRef;
        later CREATE_RELATIONSHIP operations can use @localRef in their endpoint references.
      items:
        $ref: './transactions.yaml#/Mutation'

TransactionResponse:
  type: object
  required:
    - createdEntryIds
    - entries
    - relationships
    - deletedEntryIds
    - deletedRelationshipIds
  properties:
    createdEntryIds:
      type: object
      description: Maps declared localRef names to server-generated UUIDs.
      additionalProperties:
        type: string
        format: uuid
    entries:
      type: array
      description: Current representations of created or changed Entries.
      items:
        $ref: './entries.yaml#/Entry'
    relationships:
      type: array
      description: Current representations of created or changed Relationships.
      items:
        $ref: './relationships.yaml#/Relationship'
    deletedEntryIds:
      type: array
      items:
        type: string
        format: uuid
    deletedRelationshipIds:
      type: array
      items:
        type: string
        format: uuid
TransactionRelationshipRequest:
  type: object
  additionalProperties: false
  required: [sourceEntryRef, targetEntryRef, type]
  properties:
    sourceEntryRef:
      $ref: './transactions.yaml#/EntryReference'
    targetEntryRef:
      $ref: './transactions.yaml#/EntryReference'
    type:
      $ref: './relationships.yaml#/RelationshipType'

EntryReference:
  type: string
  pattern: '^(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|@[a-z][a-z0-9_-]{0,63})$'
  description: Persisted UUID or @localRef from an earlier CREATE_ENTRY.
  example: '@capability'
