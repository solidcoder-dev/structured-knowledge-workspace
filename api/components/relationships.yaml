RelationshipType:
  type: string
  pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
  minLength: 1
  maxLength: 128
  example: product.supports

Relationship:
  type: object
  required:
    - id
    - workspaceId
    - sourceEntryId
    - targetEntryId
    - type
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    workspaceId:
      type: string
      format: uuid
    sourceEntryId:
      type: string
      format: uuid
    targetEntryId:
      type: string
      format: uuid
    type:
      $ref: './relationships.yaml#/RelationshipType'
    createdAt:
      type: string
      format: date-time
      readOnly: true

CreateRelationshipRequest:
  type: object
  additionalProperties: false
  required:
    - sourceEntryId
    - targetEntryId
    - type
  properties:
    sourceEntryId:
      type: string
      format: uuid
    targetEntryId:
      type: string
      format: uuid
    type:
      $ref: './relationships.yaml#/RelationshipType'

RelationshipPage:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: './relationships.yaml#/Relationship'
    nextCursor:
      type: string
