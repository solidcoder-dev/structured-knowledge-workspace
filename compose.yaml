services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: skw
      POSTGRES_USER: skw_local
      POSTGRES_PASSWORD: skw_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skw_local -d skw"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
